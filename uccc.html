<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <title>Cookie Options</title>
    <style>
        /* Hover effect for the Save button */
        .btn-save:hover {
            background-color: #005a9e !important;
        }
        /* Hover effect for the Cancel button */
        .btn-cancel:hover {
            background-color: #e5e5e5 !important;
        }
    </style>
</head>

<body>

<div id="ads-container" style="display: none; width: 100%; max-width: 100%; text-align: center; margin: 20px 0; min-height: 0px; overflow: hidden;"></div>

<div id="consentModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.6); font-family: 'Segoe UI', Tahoma, sans-serif;">
    <div style="background-color:#ffffff; margin:12% auto; padding:25px; border-radius:10px; width:320px; text-align:left; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        
        <div style="text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
            <h3 style="margin: 0; color:#222; font-size: 20px;">Cookie Options</h3>
            <div style="font-size: 12px; color: #666; margin-top: 5px;">@ Your Exclusive Option</div>
        </div>
        
        <div style="margin: 20px 0;">
            <p>
            <label style="display: flex; align-items: center; margin-bottom: 15px; color: #888; cursor: default;">
                <input type="checkbox" checked disabled style="margin-right: 12px; width: 18px; height: 18px;"/>
                <span style="font-size: 14px;">Functional (Always Required)</span>
            </label>
            </p>
            
            <p>
            <label style="display: flex; align-items: center; margin-bottom: 15px; color: #888; cursor: default;">
                <input type="checkbox" checked disabled style="margin-right: 12px; width: 18px; height: 18px;"/>
                <span style="font-size: 14px;">Third Party Cookie (Always Required)</span>
            </label>
            </p>

            <p>
            <label style="display: flex; align-items: center; color: #333; cursor: pointer;">
                <input type="checkbox" id="adToggle" style="margin-right: 12px; width: 18px; height: 18px;"/>
                <span style="font-size: 14px; font-weight: 500;">Show Ads</span>
            </label>
            </p>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="saveConsent()" class="btn-save" style="flex: 2; background:#0078d4; color:white; border:none; padding:12px; border-radius:5px; font-weight: bold; cursor:pointer; font-size: 14px; transition: 0.2s;">Save Preferences</button>
            <button onclick="closeModal()" class="btn-cancel" style="flex: 1; background:#f0f0f0; color:#555; border:none; padding:12px; border-radius:5px; font-weight: bold; cursor:pointer; font-size: 14px; transition: 0.2s;">Cancel</button>
        </div>

        <div><br/></div>

        <div class="ulike123-post-metadata">
          <p>
            <span class="disclaimer-text" data-source-disclaimer-type="financial-risk-warning" data-source-disclaimer-full="Kindly refer to ulike123 TOS.">
              <b>Source Disclaimer</b>: refer to <a href="https://www.ulike123.com/p/terms-of-service.html" title="ulike123 TOS">TOS</a>.
            </span>
          </p>
          <p>
            <span class="disclaimer-text" data-source-disclaimer-type="privacy-notice" data-source-disclaimer-full="Kindly refer to ulike123 PP.">
              <b>Privacy Notice</b>: refer to <a href="https://www.ulike123.com/p/privacy-policy.html" title="ulike123 PP">PP</a>.
            </span>
          </p>
        </div>

    </div>
</div>

<script>
/**
 * Cookie Functions
 */
function setCookie(name, value, days) {
    var expires = "";
    if (days) {
        var date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
}

function getCookie(name) {
    var nameEQ = name + "=";
    var ca = document.cookie.split(';');
    for (var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
    }
    return null;
}

/**
 * Modal Logic
 */
function closeModal() {
    document.getElementById("consentModal").style.display = "none";
}

function saveConsent() {
    var isChecked = document.getElementById("adToggle").checked;
    var consentStatus = isChecked ? "yes" : "no";
    setCookie("consent", consentStatus, 365);
    closeModal();
    window.location.reload();
}

/**
 * Execution
 */
window.addEventListener('DOMContentLoaded', function() {
    var userChoice = getCookie("consent");

    if (!userChoice) {
        document.getElementById("consentModal").style.display = "block";
    } else if (userChoice === "yes") {
        var adBox = document.getElementById("ads-container");
        adBox.style.display = "block";

        var googleScript = document.createElement('script');
        googleScript.async = true;
        googleScript.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID";
        googleScript.crossOrigin = "anonymous";
        document.head.appendChild(googleScript);

        adBox.innerHTML = '<div><br/></div><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-YOUR_PUBLISHER_ID" data-ad-slot="YOUR_AD_UNIT_ID" data-ad-format="auto" data-full-width-responsive="true"></ins>';

        (adsbygoogle = window.adsbygoogle || []).push({});
    }
});
</script>

</body>
</html>
